<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10-K Extraction Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #f4f5f7;
      color: #18202a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: #172238;
      color: white;
      box-shadow: 0 2px 10px #0003;
    }
    header h1 {
      margin: 0 auto 0 0;
      font-size: 18px;
    }
    select, button, .file-button {
      min-height: 36px;
      border: 1px solid #ffffff55;
      border-radius: 7px;
      padding: 7px 10px;
      background: white;
      color: #172238;
      font: inherit;
      cursor: pointer;
    }
    .file-button input { display: none; }
    main {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: calc(100vh - 64px);
    }
    aside {
      padding: 18px;
      border-right: 1px solid #d9dde3;
      background: white;
    }
    .summary {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #eef4ff;
      line-height: 1.6;
    }
    .summary strong { font-size: 21px; }
    #item-list {
      display: grid;
      gap: 6px;
    }
    .item-button {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 9px 10px;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .item-button:hover { background: #f0f3f7; }
    .item-button.active {
      background: #dce8ff;
      color: #0d3d8f;
      font-weight: 650;
    }
    article {
      min-width: 0;
      padding: 26px clamp(20px, 4vw, 60px);
    }
    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }
    .item-header h2 {
      margin: 0;
      font-size: 24px;
    }
    .score {
      margin-left: auto;
      border-radius: 999px;
      padding: 7px 12px;
      background: #e3f7e9;
      color: #176b36;
      font-weight: 700;
      white-space: nowrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric {
      padding: 11px 13px;
      border: 1px solid #d9dde3;
      border-radius: 8px;
      background: white;
    }
    .metric span {
      display: block;
      margin-bottom: 3px;
      color: #657080;
      font-size: 12px;
      text-transform: uppercase;
    }
    pre {
      margin: 0;
      border: 1px solid #d9dde3;
      border-radius: 9px;
      padding: 20px;
      background: white;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .empty {
      color: #657080;
      text-align: center;
      padding-top: 20vh;
    }
    @media (max-width: 760px) {
      header { flex-wrap: wrap; }
      header h1 { width: 100%; }
      main { grid-template-columns: 1fr; }
      aside {
        border-right: 0;
        border-bottom: 1px solid #d9dde3;
      }
      #item-list { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .metrics { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>10-K Extraction Preview</h1>
    <select id="result-select" aria-label="Choose extraction result">
      <option value="ko-2025-html.json">Coca-Cola 2025 HTML</option>
      <option value="ko-1994-10-k405.json">Coca-Cola 1994 10-K405</option>
    </select>
    <label class="file-button">
      Open JSON
      <input id="file-input" type="file" accept=".json,application/json">
    </label>
  </header>

  <main>
    <aside>
      <div class="summary">
        Filing confidence<br>
        <strong id="filing-score">—</strong><br>
        <span id="item-count">No result loaded</span>
      </div>
      <nav id="item-list" aria-label="Extracted Items"></nav>
    </aside>

    <article id="preview">
      <p class="empty">Loading extraction result…</p>
    </article>
  </main>

  <script>
    const select = document.querySelector("#result-select");
    const fileInput = document.querySelector("#file-input");
    const list = document.querySelector("#item-list");
    const preview = document.querySelector("#preview");
    const filingScore = document.querySelector("#filing-score");
    const itemCount = document.querySelector("#item-count");

    let items = [];
    let activeIndex = 0;

    const formatScore = value =>
      typeof value === "number" ? value.toFixed(3) : "—";

    function renderItem(index) {
      activeIndex = index;
      const item = items[index];
      if (!item) return;

      document.querySelectorAll(".item-button").forEach((button, position) => {
        button.classList.toggle("active", position === index);
      });

      preview.replaceChildren();

      const heading = document.createElement("div");
      heading.className = "item-header";

      const title = document.createElement("h2");
      title.textContent = `Item ${item.item}: ${item.title || "Untitled"}`;

      const score = document.createElement("div");
      score.className = "score";
      score.textContent = formatScore(item.confidence?.score);

      heading.append(title, score);

      const metrics = document.createElement("div");
      metrics.className = "metrics";
      for (const [label, key] of [
        ["Heading", "heading"],
        ["Body vs TOC", "body_vs_toc"],
        ["Section", "section"],
      ]) {
        const metric = document.createElement("div");
        metric.className = "metric";
        const name = document.createElement("span");
        name.textContent = label;
        const value = document.createElement("strong");
        value.textContent = formatScore(item.confidence?.[key]);
        metric.append(name, value);
        metrics.append(metric);
      }

      const content = document.createElement("pre");
      content.textContent = item.content || "";

      preview.append(heading, metrics, content);
    }

    function renderResult(result) {
      if (!Array.isArray(result)) {
        throw new Error("Expected a JSON list of extracted Items.");
      }

      items = result;
      list.replaceChildren();

      const average = items.length
        ? items.reduce((sum, item) => sum + Number(item.confidence?.score || 0), 0)
          / items.length
        : 0;

      filingScore.textContent = formatScore(average);
      itemCount.textContent = `${items.length} extracted Items`;

      items.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "item-button";
        button.textContent = `Item ${item.item}`;
        button.addEventListener("click", () => renderItem(index));
        list.append(button);
      });

      if (items.length) {
        renderItem(0);
      } else {
        preview.innerHTML = '<p class="empty">This result contains no Items.</p>';
      }
    }

    async function loadResult(filename) {
      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderResult(await response.json());
      } catch (error) {
        preview.innerHTML =
          '<p class="empty">Automatic loading is blocked when this file is opened directly. ' +
          'Use “Open JSON” above, or serve this folder with a local HTTP server.</p>';
        filingScore.textContent = "—";
        itemCount.textContent = error.message;
      }
    }

    select.addEventListener("change", () => loadResult(select.value));
    fileInput.addEventListener("change", async event => {
      const [file] = event.target.files;
      if (!file) return;
      try {
        renderResult(JSON.parse(await file.text()));
      } catch (error) {
        preview.innerHTML = `<p class="empty">${error.message}</p>`;
      }
    });

    loadResult(select.value);
  </script>
</body>
</html>
